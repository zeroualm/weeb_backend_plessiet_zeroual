name: CI pour le projet Django

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-not-a-real-secret
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

jobs:
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15.2"] # On peut tester sur plusieurs versions ici

    steps:
    
      - name: 1. Checkout du code
        uses: actions/checkout@v7.0.1

      - name: 2. Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Cache des dépendances pip
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 4. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Exécution des tests
        run: |
          python manage.py test
